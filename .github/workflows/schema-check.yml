name: Schema check

# Runs the migrations against a real Postgres and boots the app against the
# result. It exists because of what happened on 2026-07-31: two defects that
# nothing local could catch — a Postgres syntax error in an ALTER TABLE, and a
# CHAR(3) column a `String` field won't validate against — were each first
# executed in production, by a task that either started or didn't.
#
# There is no Postgres and no Docker on the machine this project is built from,
# and RDS lives in private subnets, so `mvn test` proves the code compiles and
# the modules don't reach into each other, and says nothing whatsoever about
# whether the application can start. This job is the missing half.
#
# It runs on pull requests, and as the deploy workflow's first job — a migration
# that fails here is a migration that would have failed in production, so
# nothing should reach ECS until it has passed.
#
# It used to also run on its own `push: branches: [main]` trigger, in parallel
# with the deploy. That is why it did not save 9fc9394 on 2026-08-02: it caught
# the missing `partner.partner_account.reward_paid_at` column 28 minutes before
# the rollout, and had no way to say so to anything. A check nothing waits for
# is a notification, not a gate. `workflow_call` is what makes it a gate; the
# push trigger is gone because deploy-backend.yml now covers main.
on:
  workflow_call:
  pull_request:
    paths:
      - 'backend/src/main/resources/db/migration/**'
      - 'backend/src/main/java/**'
  workflow_dispatch:

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gojogo
          POSTGRES_PASSWORD: gojogo
          POSTGRES_DB: gojogo
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Build
        working-directory: backend
        run: mvn -B -q package -DskipTests

      # The whole point: Flyway runs every migration from V1 on an empty
      # database, and Hibernate's `ddl-auto: validate` then checks that every
      # mapped column exists with a compatible type. Either failing stops the
      # context from starting, which fails this step.
      #
      # Everything external is left unconfigured on purpose — no Cognito, no
      # Stripe, no Sumsub, no APNs. Every one of those modules is built to treat
      # "unconfigured" as a mode rather than a failure, so a clean start here is
      # also a standing test of that claim.
      - name: Migrate a fresh database and validate the mappings
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: gojogo
          DB_USER: gojogo
          DB_PASSWORD: gojogo
          # A syntactically valid issuer that is never reached: the resource
          # server only fetches JWKS when a request arrives, and none does.
          COGNITO_ISSUER_URI: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_ImKOJoJaA
          SERVER_PORT: '8080'
          # AWS_REGION is deliberately absent, as is every other AWS variable.
          # It was set here for one day, on 2026-08-01, because the SDK resolves
          # a region *eagerly* when a client is constructed and three modules
          # built theirs at startup — so `DynamoDbClient.create()` threw before
          # Flyway's result was ever inspected, and the job had failed on all
          # three of the runs it had ever had. The modules now build their AWS
          # clients on first call instead, which is what the claim above says
          # they do. Putting this line back would hide the next module that
          # forgets.
        run: |
          set -o pipefail
          timeout 180 java -jar target/*.jar 2>&1 | tee boot.log &
          pid=$!
          for i in $(seq 1 60); do
            if curl -sf localhost:8080/actuator/health > /dev/null; then
              echo "::notice::Application started against a freshly migrated database"
              kill $pid 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 $pid 2>/dev/null; then break; fi
            sleep 3
          done
          echo "::error::The application did not start — see the log below"
          tail -80 boot.log
          exit 1
