spring:
  application:
    name: gojogo-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gojogo}
    username: ${DB_USER:gojogo}
    password: ${DB_PASSWORD:gojogo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    default-schema: public
    schemas: public,profile,social,media,notifications
    create-schemas: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/replace-me}

gojogo:
  media:
    bucket: ${MEDIA_BUCKET:}
    cdn-domain: ${MEDIA_CDN_DOMAIN:}
    # Orphan-upload sweep (see MediaCleanupJob). delete=false is report-only:
    # it logs the unreferenced objects it would delete without removing them.
    # Flip MEDIA_CLEANUP_DELETE=true only once those logs look right.
    cleanup:
      enabled: ${MEDIA_CLEANUP_ENABLED:true}
      delete: ${MEDIA_CLEANUP_DELETE:false}
      min-age-hours: ${MEDIA_CLEANUP_MIN_AGE_HOURS:24}
      batch-size: ${MEDIA_CLEANUP_BATCH_SIZE:500}
  # Native Sign in with Apple exchange (see AppleAuthService).
  apple:
    audience: ${APPLE_AUDIENCE:com.gojo.gojogo}
  cognito:
    user-pool-id: ${COGNITO_USER_POOL_ID:}
    app-client-id: ${COGNITO_APP_CLIENT_ID:}
  # My World messaging: DynamoDB single table + the API Gateway WebSocket
  # @connections management URL for server->client fan-out (see messaging module).
  messaging:
    table: ${MESSAGING_TABLE:}
    ws-endpoint: ${MESSAGING_WS_ENDPOINT:}
  # My World setup (phone verification + World profile). dev-otp-code, when set,
  # is accepted alongside the real SMS code so the flow works while SNS SMS is
  # still in the account's sandbox — leave empty in production.
  world:
    dev-otp-code: ${WORLD_OTP_DEV_CODE:}
    sms-sender-id: ${WORLD_SMS_SENDER_ID:GojoGo}
    sms-enabled: ${WORLD_SMS_ENABLED:true}
  # Food delivery. There is no dispatch module yet (Phase 3), so an order walks
  # a timeline instead of being offered to a real courier: these offsets, all
  # measured from the moment the order was placed, are the whole "kitchen +
  # courier". Shorten them to demo the tracking screen, lengthen for realism.
  delivery:
    service-fee-cents: ${DELIVERY_SERVICE_FEE_CENTS:99}
    fulfilment-poll-ms: ${DELIVERY_FULFILMENT_POLL_MS:10000}
    timeline:
      preparing-seconds: ${DELIVERY_PREPARING_SECONDS:20}
      pickup-seconds: ${DELIVERY_PICKUP_SECONDS:75}
      delivering-seconds: ${DELIVERY_DELIVERING_SECONDS:150}
      delivered-seconds: ${DELIVERY_DELIVERED_SECONDS:330}
  # Dispatch matching. Only the poll interval is here: every *policy* number —
  # search radii, wave size, offer TTL, ranking weights — lives in the config
  # registry (SPECS §3/§14) so widening the search on a busy Friday is a row and
  # not a deploy. This one is infrastructure: how often the matcher wakes up.
  dispatch:
    matching-poll-ms: ${DISPATCH_MATCHING_POLL_MS:5000}
  # Ride-hailing. Only the sweep interval is here: fares, negotiation rounds,
  # offer TTLs and the cancellation fee all live in the config registry, and the
  # price list itself is a table (travel.pricing_config) because it is
  # per-category and effective-dated. Faster than dispatch's poller because what
  # is being timed here is a person standing on a street.
  travel:
    expiry-poll-ms: ${TRAVEL_EXPIRY_POLL_MS:5000}
  # Marketplace test-data cleanup (EconomyAdminController). /v1/economy/admin/**
  # exists only while this token is set to 16+ characters; unset — the
  # production default — those paths 404. Set ECONOMY_ADMIN_TOKEN for the deploy
  # that does the wipe, then unset it and deploy again.
  economy:
    admin:
      token: ${ECONOMY_ADMIN_TOKEN:}
  # Partner review (PartnerAdminController). Two ways in: `group` is the real
  # operator identity — a Cognito group carried in the reviewer's own ID token,
  # which is what GoJoAdmin signs in with and what makes a decision
  # attributable; `token` is break-glass, one shared secret with no identity,
  # for the operator with no console. Unset token = group-only, which is the
  # intended end state.
  partner:
    admin:
      token: ${PARTNER_ADMIN_TOKEN:}
      group: ${PARTNER_ADMIN_GROUP:platform-admin}
  # Identity verification (Sumsub). All empty → the whole module is off and
  # identity is proved the way it always was: an ID card uploaded into the
  # private prefix and a human verdict on the partner review surface. That
  # fallback is the point of the IdentityVerificationApi seam (SPECS.md §4) —
  # the vendor is a config swap, not a rewrite.
  #
  # app-token decides the environment on its own: a sandbox token is prefixed
  # `sbx:` and the API host is identical either way, so check the startup log
  # line before believing a verdict. webhook-secret is a DIFFERENT secret from
  # secret-key — it is set when the webhook is created in the Sumsub cockpit,
  # and while it is empty /v1/kyc/webhook refuses everything and the app's
  # POST /v1/kyc/refresh pull is what moves a verification forward.
  kyc:
    sumsub:
      base-url: ${SUMSUB_BASE_URL:https://api.sumsub.com}
      app-token: ${SUMSUB_APP_TOKEN:}
      secret-key: ${SUMSUB_SECRET_KEY:}
      webhook-secret: ${SUMSUB_WEBHOOK_SECRET:}
      level-name: ${SUMSUB_LEVEL_NAME:id-and-liveness}
      token-ttl-seconds: ${SUMSUB_TOKEN_TTL_SECONDS:600}
  # Payments (Stripe). All empty → the GoJo Wallet still works for every
  # internal movement (hold, capture, release, transfer between buckets) and
  # only the outside world is unreachable: no card top-up, no payout. That is a
  # mode, not a failure — the ledger is the product, Stripe is the door.
  #
  # secret-key decides the environment on its own: `sk_test_` is test mode and
  # nothing else about the integration looks different, so check the startup log
  # before believing a charge. webhook-secret is a DIFFERENT secret, minted when
  # the endpoint is created in the Stripe dashboard, which is why it is
  # legitimately empty on a first deploy — and while it is empty, top-ups are
  # refused rather than started, because a payment this backend can take but
  # cannot learn about is a customer charged for nothing.
  #
  # return-base-url must be this API's own public origin: Stripe Checkout
  # refuses a custom URL scheme, so the trip back into the app goes through
  # /v1/payments/return, which redirects to gojogo://.
  payments:
    stripe:
      base-url: ${STRIPE_BASE_URL:https://api.stripe.com}
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
      return-base-url: ${STRIPE_RETURN_BASE_URL:https://api.gojogo.app}
      app-scheme: ${STRIPE_APP_SCHEME:gojogo}
  # Browser origins allowed to call this API (comma-separated). Empty — the
  # default — emits no CORS headers at all, which is correct while the only
  # client is the iOS app. GoJoAdmin's origin goes here when it exists.
  web:
    allowed-origins: ${WEB_ALLOWED_ORIGINS:}
  # APNs push (activity notifications). All empty → push disabled (sender
  # no-ops). key-base64 is the base64 of the Apple .p8 token-auth key file.
  apns:
    key-id: ${APNS_KEY_ID:}
    team-id: ${APNS_TEAM_ID:}
    bundle-id: ${APNS_BUNDLE_ID:com.gojo.gojogo}
    key-base64: ${APNS_KEY_BASE64:}
    production: ${APNS_PRODUCTION:false}

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
