definitions:
  env_versions: &env_versions
    # Pin to a specific version (e.g. 26.1) once you know which one you want to
    # stay on; the project needs Xcode 16 or newer either way.
    xcode: latest

  mapbox_credentials: &mapbox_credentials
    name: Write Mapbox credentials
    script: |
      set -e
      # Secret sk.* token — lets SPM download the Mapbox binaries.
      if [ -z "$MAPBOX_DOWNLOADS_TOKEN" ]; then
        echo "MAPBOX_DOWNLOADS_TOKEN is missing. Add it to the 'mapbox' environment group."
        exit 1
      fi
      cat > "$HOME/.netrc" <<EOF
      machine api.mapbox.com
      login mapbox
      password $MAPBOX_DOWNLOADS_TOKEN
      EOF
      chmod 600 "$HOME/.netrc"

      # Public pk.* token — bundled as a resource, read at runtime by MapboxConfig.
      if [ -z "$MAPBOX_PUBLIC_TOKEN" ]; then
        echo "MAPBOX_PUBLIC_TOKEN is missing. Add it to the 'mapbox' environment group."
        exit 1
      fi
      printf '%s' "$MAPBOX_PUBLIC_TOKEN" > "$CM_BUILD_DIR/GojoGo/MapboxAccessToken"

  vendor_libsignal: &vendor_libsignal
    name: Vendor libsignal (prebuilt)
    script: |
      # E2EE (see E2EE-PLAN.md): fetches Signal's prebuilt libsignal_ffi.a and
      # version-matched Swift sources into Vendor/LibSignalClient. The script
      # no-ops when the cached copy is already there, so with Vendor/ in
      # cache_paths only the first build after a version bump pays the 151 MB.
      # Must run before package resolution — the local package's sources are
      # gitignored and exist only after this step.
      bash "$CM_BUILD_DIR/scripts/fetch-libsignal.sh"

  resolve_packages: &resolve_packages
    name: Resolve Swift packages
    script: |
      xcodebuild -resolvePackageDependencies \
        -project "$CM_BUILD_DIR/GojoGo.xcodeproj" \
        -scheme "$XCODE_SCHEME"

workflows:
  ios-testflight:
    name: iOS — build & ship to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: GojoGo App Store Connect
    environment:
      <<: *env_versions
      groups:
        - mapbox
        # CERTIFICATE_PRIVATE_KEY — the RSA key Apple builds the distribution
        # certificate from. Generated once and never changed; see CODEMAGIC.md.
        - signing
      # No `ios_signing:` block here on purpose. That block fetches signing files
      # *already uploaded to Codemagic* under Team settings → Code signing
      # identities; with nothing uploaded it fails during machine setup with
      # "No matching profiles found for bundle identifier". Signing files are
      # fetched from Apple in the scripts below instead.
      vars:
        XCODE_PROJECT: "GojoGo.xcodeproj"
        XCODE_SCHEME: "GojoGo"
        BUNDLE_ID: "com.gojo.gojogo"
        # Numeric Apple ID of the app in App Store Connect — the build number is
        # read from there and bumped by one. Clear it and the build number falls
        # back to Codemagic's own counter, which starts at 1.
        APP_STORE_APPLE_ID: "6762012938"
    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/Library/Developer/Xcode/DerivedData/**/SourcePackages
        # ~560 MB of vendored libsignal slices; the fetch step skips when warm.
        - $CM_BUILD_DIR/Vendor
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - *mapbox_credentials

      - name: Fetch signing files from Apple and set up code signing
        script: |
          set -e
          keychain initialize

          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "CERTIFICATE_PRIVATE_KEY is missing. Add it to the 'signing' environment group."
            echo
            echo "Apple builds the distribution certificate from a private key you own, so"
            echo "there is nothing for this build to create one from. Generate a key once:"
            echo
            echo "  ssh-keygen -t rsa -b 2048 -m PEM -f ios_distribution_private_key -q -N ''"
            echo
            echo "then paste the whole file — including the BEGIN and END RSA PRIVATE KEY"
            echo "lines — into a secure variable named CERTIFICATE_PRIVATE_KEY. Do not"
            echo "base64-encode it. Keep the same key forever: it is what lets later builds"
            echo "recognise the certificate they already have instead of asking Apple for"
            echo "another one, and Apple caps distribution certificates at three."
            exit 1
          fi

          # --create makes Apple mint whatever is missing: the App Store
          # provisioning profile for the bundle ID, and a distribution
          # certificate built from CERTIFICATE_PRIVATE_KEY if no certificate
          # matching that key exists yet.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create

          keychain add-certificates
          xcode-project use-profiles

      - name: Switch push notifications to the production environment
        script: |
          # The checked-in entitlements ask for the development APS environment,
          # which an App Store profile does not grant. Distribution builds need
          # production; the repo copy stays untouched.
          /usr/libexec/PlistBuddy \
            -c "Set :aps-environment production" \
            "$CM_BUILD_DIR/GojoGo/GojoGo.entitlements"

      - *vendor_libsignal
      - *resolve_packages

      - name: Pick the next build number
        script: |
          set -e
          NEXT="$PROJECT_BUILD_NUMBER"
          if [ -n "$APP_STORE_APPLE_ID" ]; then
            LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" --all-versions || true)
            if [ -n "$LATEST" ]; then
              NEXT=$((LATEST + 1))
            else
              # Don't let this pass unnoticed: Codemagic's counter can land on a
              # build number App Store Connect has already seen, and the upload
              # is then rejected at the very end of the build.
              echo "WARNING: could not read the latest build number for APP_STORE_APPLE_ID=$APP_STORE_APPLE_ID."
              echo "WARNING: falling back to Codemagic's counter ($NEXT), which may collide with an existing build."
            fi
          fi
          echo "Building as build number $NEXT"
          echo "NEW_BUILD_NUMBER=$NEXT" >> "$CM_ENV"

      - name: Build the signed IPA
        script: |
          set -e
          XCARGS="COMPILER_INDEX_STORE_ENABLE=NO CURRENT_PROJECT_VERSION=$NEW_BUILD_NUMBER"
          # Start a build with APP_VERSION=1.1.0 to cut a new marketing version;
          # otherwise the version in the project file is used as-is.
          if [ -n "$APP_VERSION" ]; then
            XCARGS="$XCARGS MARKETING_VERSION=$APP_VERSION"
          fi
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config "Release" \
            --archive-xcargs "$XCARGS"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - amrkharchoufi3@gmail.com
        notify:
          success: true
          failure: true

  ios-check:
    name: iOS — compile check (branch pushes)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      <<: *env_versions
      groups:
        - mapbox
      vars:
        XCODE_PROJECT: "GojoGo.xcodeproj"
        XCODE_SCHEME: "GojoGo"
    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/Library/Developer/Xcode/DerivedData/**/SourcePackages
        # ~560 MB of vendored libsignal slices; the fetch step skips when warm.
        - $CM_BUILD_DIR/Vendor
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - *mapbox_credentials
      - *vendor_libsignal
      - *resolve_packages
      - name: Build for the simulator, unsigned
        script: |
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log
